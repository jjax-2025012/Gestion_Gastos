<div class="login-container">
  <div class="login-card">
    
    <div class="logo-wrapper">
      <img src="/assets/logo.png" alt="Logo OSCORP" class="login-logo" />
    </div>

    <div class="header-text">
      <h2>Iniciar Sesión</h2>
      <p class="subtitle">OSCORP - Gestión de Gastos</p>
    </div>

    <div *ngIf="errorMessage" class="error-alert">
      <span class="error-icon">⚠️</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="ejemplo@correo.com"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            required
          />
        </div>
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-submit">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading" class="spinner-text">
          <span class="spinner"></span> Ingresando...
        </span>
      </button>
    </form>

<div class="auth-footer">
  <span>¿No tienes una cuenta? </span>
  <a routerLink="/register" class="register-link">Regístrate aquí</a>
</div>

  </div>
</div>
